name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the proxy server answers
        run: |
          URL=$(grep '^PROXY_URL=' app/proxy.properties | cut -d= -f2-)
          if [ -n "$URL" ]; then
            root=$(curl -sS -m 30 "$URL/"); echo "$root"
            code=$(curl -sS -m 30 -o models.json -w '%{http_code}' "$URL/v1beta/models")
            echo "HTTP $code"; head -c 300 models.json; echo
            if echo "$root" | grep -q "accounts on"; then
              # Accounts are on: requests without login must be refused.
              test "$code" = "401"
            else
              # Lists models: confirms the server has a working Gemini key (uses no message quota).
              grep -o '"name": *"models/gemini-[^"]*"' models.json | head -20 || true
              test "$code" = "200"
            fi
          fi

      - name: Test and build
        env:
          # Set in GitHub: Settings > Secrets and variables > Actions.
          PROXY_URL: ${{ vars.PROXY_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: ./gradlew :core:test :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MedAnaliz-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedAnaliz-apk
          path: MedAnaliz-*.apk

      # Each build on main becomes a Release, so the APK can be downloaded straight from a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: МедАнализ 1.0.${{ github.run_number }}
          files: MedAnaliz-*.apk

  # Builds a demo version and takes screenshots on an emulator, to check the design.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build demo APK
        env:
          DEMO: "1"
        run: ./gradlew :app:assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
      # Screenshots also go to the ci-screenshots branch so they can be viewed without downloading artifacts.
      - name: Push screenshots to branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
