name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the proxy server answers
        run: |
          URL=$(grep '^PROXY_URL=' app/proxy.properties | cut -d= -f2-)
          if [ -n "$URL" ]; then
            curl -sS -m 30 "$URL/"; echo
            # Lists models: confirms the server has a working Gemini key (uses no message quota).
            code=$(curl -sS -m 30 -o models.json -w '%{http_code}' "$URL/v1beta/models")
            echo "HTTP $code"; head -c 300 models.json; echo
            grep -o '"name": *"models/gemini-[^"]*"' models.json | head -20 || true
            test "$code" = "200"
            # One tiny real request through the proxy (uses 1 of the free daily requests of the lite model).
            curl -sS -m 60 -o reply.txt -w 'generate HTTP %{http_code}\n' -H 'content-type: application/json' \
              -d '{"contents":[{"role":"user","parts":[{"text":"Ответь одним словом: работает?"}]}],"generationConfig":{"maxOutputTokens":200}}' \
              "$URL/v1beta/models/gemini-flash-lite-latest:streamGenerateContent?alt=sse"
            head -c 600 reply.txt; echo
          fi

      - name: Test and build
        env:
          # Set in GitHub: Settings > Secrets and variables > Actions.
          PROXY_URL: ${{ vars.PROXY_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: ./gradlew :core:test :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MedAnaliz-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedAnaliz-apk
          path: MedAnaliz-*.apk

      # Each build on main becomes a Release, so the APK can be downloaded straight from a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: МедАнализ 1.0.${{ github.run_number }}
          files: MedAnaliz-*.apk
